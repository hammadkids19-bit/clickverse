<!DOCTYPE html>
<html>
<head>
  <title>Clickverse</title>
<style>
@keyframes rainbow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
</style>
</head>
<body style="margin:0; min-height:100vh; background:linear-gradient(135deg,red,orange,yellow,green,cyan,blue,purple);
background-size:400% 400%;
animation:rainbow 20s linear infinite; color:white; font-family:Arial,sans-serif; text-align:center;">

  <h1>Clickverse</h1>

  <p style="
  font-size:30px;
  font-weight:bold;
  background:rgba(255,255,255,0.15);
  padding:15px 30px;
  border-radius:15px;
  display:inline-block;
">
  Clicks: <span id="clicks">0</span>
</p>

  <button onclick="clickButton()" style="
  font-size:40px;
  padding:30px 80px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  background:white;
transition:0.2s;
  color:#1e3a8a;
  font-weight:bold;
  box-shadow:0 10px 25px rgba(0,0,0,0.35);
  transition:0.1s;
"
onmousedown="this.style.background='#cccccc';"
onmouseover="this.style.transform='scale(1.08)';"
onmouseout="this.style.transform='scale(1)';"
>
  CLICK ME!
</button>
<br><br>

<button onclick="openShop()" style="
  font-size:25px;
  padding:15px 40px;
  border:none;
  border-radius:15px;
  cursor:pointer;
  background:#facc15;
  color:#111827;
  font-weight:bold;
">
  🛒 SHOP
</button>
  <script>
    let clicks = 0;
let clickPower = 1;
let autoClickers = 0;
function buyAutoClicker() {
  if (clicks >= 50) {
    clicks -= 50;
    autoClickers++;
  }
}
function openShop() {
  let choice = prompt(
    "🛒 CLICKVERSE SHOP\n\n" +
    "1 = 🤖 Auto Clicker (50 clicks)\n" +
    "2 = ⚡ Super Clicker (100 clicks)\n" +
    "3 = 💥 Hyper Clicker (200 clicks)\n\n" +
    "Type 1, 2, or 3:"
  );

  if (choice === "1") {
    buyAutoClicker();
  }
}

    function clickButton() {
      clicks += clickPower;
      document.getElementById("clicks").textContent = clicks;
    }
  </script>

</body>
</html>
