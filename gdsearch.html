
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GD Video Finder</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101225;
  color: white;
}
header {
  text-align: center;
  padding: 35px 16px;
  background: linear-gradient(135deg, #5435d9, #08a9d6);
}
h1 { margin: 0 0 10px; font-size: 34px; }
header p { margin: 0; }
main { max-width: 900px; margin: auto; padding: 24px 16px; }
.search {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
}
input, button {
  padding: 14px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}
input { flex: 1; min-width: 0; background: #242741; color: white; }
button {
  cursor: pointer;
  color: white;
  background: #6b4cff;
  font-weight: bold;
}
button:hover { background: #8974ff; }
#results {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}
.card {
  background: #20233c;
  padding: 18px;
  border-radius: 14px;
  overflow-wrap: anywhere;
}
.card h2 { font-size: 20px; }
.card a { color: #75dcff; }
.empty { color: #b9bbd0; text-align: center; }
.note { color: #b9bbd0; font-size: 13px; margin-top: 24px; }
@media(max-width: 480px) {
  .search { flex-direction: column; }
}
</style>
</head>
<body>
<header>
  <h1>🎮 GD VIDEO FINDER</h1>
  <p>Search it. Find it. WATCH IT! 💥</p>
</header>

<main>
  <div class="search">
    <input id="query" placeholder="Search a GD video..." aria-label="Search videos">
    <button id="searchBtn">🔎 SEARCH</button>
  </div>

  <div id="results"></div>
  <p class="note">
    Your Geometry Dash video collection. Add your videos in the code
    to make them searchable.
  </p>
</main>

<script>
// ADD YOUR VIDEOS HERE.
// Replace the example below with your own video details.
const videos = [
  {
    title: "My First GD Video",
    description: "My Geometry Dash gameplay!",
    url: "https://drive.google.com/"
  }
];

const query = document.getElementById("query");
const results = document.getElementById("results");

function searchVideos() {
  const term = query.value.trim().toLowerCase();
  const matches = videos.filter(video =>
    (video.title + " " + video.description)
      .toLowerCase().includes(term)
  );

  results.replaceChildren();

  if (matches.length === 0) {
    const message = document.createElement("p");
    message.className = "empty";
    message.textContent = "No videos found 😭 Try another search!";
    results.appendChild(message);
    return;
  }

  matches.forEach(video => {
    const card = document.createElement("article");
    card.className = "card";

    const title = document.createElement("h2");
    title.textContent = "🎬 " + video.title;

    const description = document.createElement("p");
    description.textContent = video.description;

    const link = document.createElement("a");
    link.href = video.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "▶ WATCH VIDEO";

    card.append(title, description, link);
    results.appendChild(card);
  });
}

document.getElementById("searchBtn")
  .addEventListener("click", searchVideos);

query.addEventListener("input", searchVideos);
query.addEventListener("keydown", event => {
  if (event.key === "Enter") searchVideos();
});

searchVideos();
</script>
</body>
</html>
